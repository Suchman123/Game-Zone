<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Game Zone</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="validate.js"></script>
    <link rel='stylesheet' href='main.css'>
</head>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger" href="index.html">Game Zone</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="games.html">GAMES</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="register.html">REGISTER</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
<body class="bg-dark text-light">
    <section class="py-5 text-center container">
            <div class="row py-lg-5">
                <div class="col-lg-6 col-md-8 mx-auto">
                    <h1 class="fw-bold display-4 text-white">Weekend League</h1>
                </div>
            </div>
        </section>
    <section class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
            <div class="card bg-dark text-light border-secondary">
                <div class="card-body">
                <form id="form">
                    <div class="mb-3">
                        <label for="gamerTag" class="form-label">Gamer Tag<span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="gamerTag" >
                        <div class="invalid-feedback text-danger">Please enter a gamer tag</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email<span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="email" >
                        <div class="invalid-feedback text-danger">Please enter a valid Email</div>
                    </div>

                    <div class="mb-3">
                        <label for="game" class="form-label">Select Game<span class="text-danger">*</span></label>
                        <select class="form-select" id="game" >
                            <option value="" selected disabled>Choose a game</option>
                            <option value="rl">Rocket League</option>
                            <option value="lol">League of Legends</option>
                            <option value="cs2">Counter Strike 2</option>
                        </select>
                        <div class="invalid-feedback text-danger">Please enter a gamer tag</div>
                    </div>

                    <div class= "row justify-content-center">
                    <button type="submit" class="btn btn-danger" onclick="validateForm()">Submit</button>
                    </div>
                </form>
                </div>
            </div>
            </div>
        </div>
    </section>
    
    
    
</body>
<footer class="bg-black text-center text-secondary py-4 mt-5 border-top border-secondary">
        <div class="container">
            <p class="mb-0">&copy; 2026 Game Zone.</p>
        </div>
    </footer>
</html>
